<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Hurricane Track Animation</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #111;
    overflow: hidden;
    font-family: Arial, sans-serif;
  }

  #map {
    width: 100%;
    height: 100%;
  }

  /* Hurricane category markers */
  .storm-marker {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid white;
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
    background: black;
  }

  .storm-marker img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Optional label */
  .storm-label {
    color: white;
    font-size: 14px;
    font-weight: bold;
    text-shadow: 0 0 5px black;
  }

  /* Hurricane path */
  .leaflet-interactive {
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Floating info panel */
  .info-box {
    position: absolute;
    top: 30px;
    left: 30px;
    width: 340px;
    padding: 24px;
    z-index: 1000;

    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(10px);

    border-radius: 18px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.35);
  }

  .info-box h1 {
    margin: 0 0 12px;
    font-size: 32px;
    color: #222;
  }

  .info-box p {
    margin: 0;
    line-height: 1.5;
    color: #444;
  }
</style>
</head>
<body>

<div id="map"></div>

<div class="info-box">
  <h1>Storm Track</h1>
  <p>
    Replace the bbox, raster image overlay, and storm points with your own data.
  </p>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/*
=====================================================
1. CREATE MAP
=====================================================
*/

const map = L.map("map", {
  zoomControl: false,
  attributionControl: false
});

/*
=====================================================
2. CUSTOM BBOX
Replace this with YOUR bbox

Format:
[
  [southWestLat, southWestLng],
  [northEastLat, northEastLng]
]
=====================================================
*/

const bbox = [
  [18.0, -98.0],
  [42.0, -65.0]
];

map.fitBounds(bbox);

/*
=====================================================
3. OPTIONAL DARK BASEMAP
=====================================================
*/

L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
  {
    subdomains: "abcd",
    maxZoom: 19
  }
).addTo(map);

/*
=====================================================
4. ADD YOUR HEATMAP / CLIMATE IMAGE OVERLAY
Replace:
- image URL
- bbox
=====================================================
*/

const overlayBounds = [
  [18.0, -98.0],
  [42.0, -65.0]
];

L.imageOverlay(
  "YOUR_OVERLAY_IMAGE.png",
  overlayBounds,
  {
    opacity: 0.85
  }
).addTo(map);

/*
=====================================================
5. HURRICANE TRACK DATA

Each point:
- lat
- lng
- category
- icon image

Replace image paths with your own images
=====================================================
*/

const stormPoints = [
  {
    lat: 20.2,
    lng: -86.5,
    category: "TS",
    icon: "icons/ts.png"
  },
  {
    lat: 22.0,
    lng: -87.1,
    category: "1",
    icon: "icons/cat1.png"
  },
  {
    lat: 24.3,
    lng: -88.0,
    category: "2",
    icon: "icons/cat2.png"
  },
  {
    lat: 26.5,
    lng: -89.4,
    category: "3",
    icon: "icons/cat3.png"
  },
  {
    lat: 29.0,
    lng: -90.5,
    category: "4",
    icon: "icons/cat4.png"
  },
  {
    lat: 33.2,
    lng: -84.8,
    category: "TS",
    icon: "icons/ts.png"
  }
];

/*
=====================================================
6. DRAW HURRICANE PATH
=====================================================
*/

const latlngs = stormPoints.map(p => [p.lat, p.lng]);

L.polyline(latlngs, {
  color: "white",
  weight: 4,
  opacity: 0.95,
  dashArray: "10 8"
}).addTo(map);

/*
=====================================================
7. PLACE CUSTOM ICONS ON TRACK
=====================================================
*/

stormPoints.forEach(point => {

  const icon = L.divIcon({
    className: "",
    html: `
      <div class="storm-marker">
        <img src="${point.icon}" />
      </div>
    `,
    iconSize: [42, 42],
    iconAnchor: [21, 21]
  });

  L.marker([point.lat, point.lng], {
    icon
  })
  .addTo(map)
  .bindTooltip(point.category, {
    permanent: true,
    direction: "center",
    className: "storm-label",
    offset: [0, 0]
  });
});

/*
=====================================================
8. OPTIONAL: ANIMATED MOVING HURRICANE
=====================================================
*/

const movingIcon = L.divIcon({
  className: "",
  html: `
    <div class="storm-marker">
      <img src="icons/hurricane-center.png" />
    </div>
  `,
  iconSize: [52, 52],
  iconAnchor: [26, 26]
});

const movingMarker = L.marker(latlngs[0], {
  icon: movingIcon
}).addTo(map);

let idx = 0;

setInterval(() => {
  idx++;

  if (idx >= latlngs.length) {
    idx = 0;
  }

  movingMarker.setLatLng(latlngs[idx]);

}, 1000);

</script>

</body>
</html>
